<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#081222">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="資產儀表板">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <title>投資資產儀表板</title>
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <p class="eyebrow">ERIC'S PORTFOLIO</p>
        <h1>投資資產儀表板</h1>
      </div>
      <button id="refreshAll" class="primary compact">更新全部</button>
    </header>

    <section class="summary-grid">
      <article class="summary-card total"><span>總資產（新台幣）</span><strong id="totalTwd">NT$0</strong><small id="lastUpdated">尚未更新</small></article>
      <article class="summary-card"><span>今日損益</span><strong id="dailyPnl">NT$0</strong><small id="dailyPnlPct">0.00%</small></article>
      <article class="summary-card"><span>台股市值</span><strong id="twTotal">NT$0</strong><small id="twCount">0 檔</small></article>
      <article class="summary-card"><span>美股市值</span><strong id="usTotal">US$0</strong><small id="fxText">USD/TWD --</small></article>
      <article class="summary-card"><span>現金</span><strong id="cashTotal">NT$0</strong><small>台幣＋美元換算</small></article>
      <article class="summary-card"><span>可質押額度</span><strong id="pledgeTotal">NT$0</strong><small id="pledgeText">依自訂成數</small></article>
    </section>

    <nav class="tabs">
      <button data-tab="portfolio" class="active">持股</button>
      <button data-tab="allocation">配置</button>
      <button data-tab="cash">現金／質押</button>
      <button data-tab="history">歷史</button>
      <button data-tab="settings">設定</button>
    </nav>

    <section id="portfolio" class="tab-panel active">
      <article class="card">
        <div class="section-head"><h2>新增持股</h2><span>台股與美股</span></div>
        <div class="form-grid three">
          <label>市場<select id="market"><option value="TW">台股</option><option value="US">美股</option></select></label>
          <label>股票代號<input id="symbol" placeholder="0050、QQQM" autocapitalize="characters"></label>
          <label>持有股數<input id="shares" type="number" min="0" step="any" placeholder="1000"></label>
        </div>
        <div class="form-grid two">
          <label>手動價格（選填）<input id="manualPrice" type="number" min="0" step="any" placeholder="報價失敗時使用"></label>
          <label>質押成數（選填）<input id="pledgeRatio" type="number" min="0" max="100" step="1" placeholder="例如 60"></label>
        </div>
        <button id="addHolding" class="primary full">加入持股</button>
      </article>

      <article class="card">
        <div class="section-head"><h2>我的持股</h2><button id="clearHoldings" class="text-button danger-text">全部清除</button></div>
        <div id="holdingsList" class="holding-list"></div>
      </article>
    </section>

    <section id="allocation" class="tab-panel">
      <article class="card">
        <div class="section-head"><h2>資產配置</h2><span>依目前市值</span></div>
        <canvas id="allocationChart" width="500" height="500"></canvas>
        <div id="allocationLegend" class="legend"></div>
      </article>
    </section>

    <section id="cash" class="tab-panel">
      <article class="card">
        <div class="section-head"><h2>現金部位</h2><span>納入總資產</span></div>
        <div class="form-grid two">
          <label>台幣現金<input id="cashTwd" type="number" min="0" step="any"></label>
          <label>美元現金<input id="cashUsd" type="number" min="0" step="any"></label>
        </div>
        <button id="saveCash" class="primary full">儲存現金</button>
      </article>

      <article class="card">
        <div class="section-head"><h2>質押試算</h2><span>概算</span></div>
        <div class="info-row"><span>持股可質押額度</span><strong id="pledgeHolding">NT$0</strong></div>
        <div class="info-row"><span>目前質押借款</span><input id="pledgeDebt" type="number" min="0" step="any"></div>
        <div class="info-row"><span>剩餘可借額度</span><strong id="pledgeRemaining">NT$0</strong></div>
        <div class="info-row"><span>概算維持率</span><strong id="maintenanceRatio">--</strong></div>
        <button id="savePledge" class="primary full">儲存質押借款</button>
      </article>
    </section>

    <section id="history" class="tab-panel">
      <article class="card">
        <div class="section-head"><h2>資產歷史</h2><button id="saveSnapshot" class="secondary compact">記錄今天</button></div>
        <canvas id="historyChart" width="720" height="360"></canvas>
        <div id="historyList" class="history-list"></div>
      </article>
    </section>

    <section id="settings" class="tab-panel">
      <article class="card">
        <div class="section-head"><h2>資料來源設定</h2><span>只存在本機</span></div>
        <label>Cloudflare Worker 網址<input id="workerUrl"></label>
        <label>Finnhub API Key（美股）<input id="finnhubKey" type="password" placeholder="免費 API Key"></label>
        <label>USD/TWD 匯率<input id="fxRate" type="number" min="0" step="0.0001"></label>
        <button id="saveSettings" class="primary full">儲存設定</button>
        <button id="testWorker" class="secondary full">測試 Worker</button>
        <div id="settingsStatus" class="status"></div>
      </article>
    </section>

    <div id="toast" class="toast"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
